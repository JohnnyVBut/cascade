<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascade — API Guide</title>
  <script src="../js/vendor/marked.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2937;
      --border: #e5e7eb;
      --code-bg: #f3f4f6;
      --link: #7c3aed;
      --head-bg: #f9fafb;
      --table-alt: #f9fafb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --fg: #e5e5e5;
        --border: #404040;
        --code-bg: #262626;
        --link: #a78bfa;
        --head-bg: #262626;
        --table-alt: #1f1f1f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.65;
      padding: 0;
    }
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--head-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #toolbar h1 {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }
    #lang-toggle {
      display: flex;
      gap: 6px;
    }
    #lang-toggle button {
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 12px;
      cursor: pointer;
    }
    #lang-toggle button.active {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
    }
    #content {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }
    #content h1 { font-size: 1.75rem; font-weight: 700; margin: 1.5rem 0 0.75rem; }
    #content h2 { font-size: 1.35rem; font-weight: 600; margin: 2rem 0 0.6rem; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    #content h3 { font-size: 1.1rem; font-weight: 600; margin: 1.4rem 0 0.4rem; }
    #content h4 { font-size: 1rem; font-weight: 600; margin: 1rem 0 0.3rem; }
    #content p  { margin: 0.5rem 0; }
    #content a  { color: var(--link); text-decoration: none; }
    #content a:hover { text-decoration: underline; }
    #content ul, #content ol { margin: 0.5rem 0 0.5rem 1.5rem; }
    #content li { margin: 0.2rem 0; }
    #content code {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.875em;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 3px;
    }
    #content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    #content pre code { background: none; padding: 0; font-size: 0.82rem; }
    #content table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.75rem 0;
      font-size: 0.9rem;
    }
    #content th {
      background: var(--head-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
    }
    #content td {
      border: 1px solid var(--border);
      padding: 7px 12px;
    }
    #content tr:nth-child(even) td { background: var(--table-alt); }
    #content blockquote {
      border-left: 3px solid #7c3aed;
      margin: 0.75rem 0;
      padding: 6px 14px;
      color: #6b7280;
      background: var(--code-bg);
      border-radius: 0 4px 4px 0;
    }
    #content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>📖 Cascade — API Guide</h1>
    <div id="lang-toggle">
      <button id="btn-en" onclick="setLang('en')">English</button>
      <button id="btn-ru" onclick="setLang('ru')">Русский</button>
    </div>
  </div>
  <div id="content"><p style="padding:2rem;color:#9ca3af;">Loading…</p></div>

  <script>
    var LANG_KEY = 'cascade-api-guide-lang';

    function getLang() {
      // 1. URL param  2. localStorage  3. default en
      var params = new URLSearchParams(window.location.search);
      return params.get('lang') || localStorage.getItem(LANG_KEY) || 'en';
    }

    function setLang(lang) {
      localStorage.setItem(LANG_KEY, lang);
      // update URL without reload
      var url = new URL(window.location.href);
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url);
      load(lang);
    }

    function load(lang) {
      var file = lang === 'ru' ? './API.md' : './API.en.md';
      document.getElementById('btn-en').className = lang === 'en' ? 'active' : '';
      document.getElementById('btn-ru').className = lang === 'ru' ? 'active' : '';

      fetch(file)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function(md) {
          document.getElementById('content').innerHTML = marked.parse(md);
        })
        .catch(function(e) {
          document.getElementById('content').innerHTML =
            '<p style="color:#ef4444;padding:2rem;">Failed to load API docs: ' + e.message + '</p>';
        });
    }

    load(getLang());
  </script>
</body>
</html>
